<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090f">
<title>🐺 WEREWOLF</title>
<style>
/* ============================================================
   CSS VARIABLES & RESET
   ============================================================ */
:root{
  --bg:#08090f;
  --bg2:#0d0f1c;
  --panel:#111428;
  --panel2:#181d36;
  --line:#222744;
  --line2:#2e3560;
  --moon:#ece6d3;
  --dim:#6e7494;
  --dim2:#44496a;
  --red:#e8445a;
  --redbg:rgba(232,68,90,.14);
  --vio:#8b7fd4;
  --vio2:#b0a8f0;
  --viobg:rgba(139,127,212,.13);
  --gold:#d4a843;
  --gold2:#f5cc5c;
  --goldbg:rgba(212,168,67,.11);
  --ok:#4dbf8a;
  --ok2:#6edba8;
  --okbg:rgba(77,191,138,.11);
  --cyan:#3bbfd4;
  --cyanbg:rgba(59,191,212,.11);
  --neon-r:0 0 8px rgba(232,68,90,.9),0 0 24px rgba(232,68,90,.4),0 0 48px rgba(232,68,90,.15);
  --neon-v:0 0 8px rgba(139,127,212,.9),0 0 24px rgba(139,127,212,.4),0 0 48px rgba(139,127,212,.15);
  --neon-g:0 0 8px rgba(212,168,67,.9),0 0 24px rgba(212,168,67,.4),0 0 48px rgba(212,168,67,.15);
  --neon-c:0 0 8px rgba(59,191,212,.9),0 0 24px rgba(59,191,212,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{font-size:16px}
body{
  background:var(--bg);
  color:var(--moon);
  font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}

/* ============================================================
   ANIMATED STAR FIELD
   ============================================================ */
body::before,body::after{
  content:'';
  position:fixed;inset:0;
  pointer-events:none;z-index:0;
}
body::before{
  background:
    radial-gradient(1px 1px at  8% 12%,rgba(255,255,255,.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 22% 78%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 38%  5%,rgba(255,255,255,.8) 0%,transparent 100%),
    radial-gradient(1px 1px at 52% 48%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 67% 88%,rgba(255,255,255,.6) 0%,transparent 100%),
    radial-gradient(2px 2px at 81% 33%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 91% 61%,rgba(255,255,255,.7) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 14% 55%,rgba(200,180,255,.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 44% 92%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 73% 18%,rgba(255,255,255,.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 96%  8%,rgba(255,220,180,.7) 0%,transparent 100%),
    radial-gradient(1px 1px at  3% 95%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 58% 72%,rgba(180,220,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 29% 39%,rgba(255,255,255,.3) 0%,transparent 100%),
    radial-gradient(1px 1px at 85% 84%,rgba(255,255,255,.5) 0%,transparent 100%);
}
body::after{
  background:
    radial-gradient(ellipse 60% 40% at 30% 20%,rgba(80,40,140,.12) 0%,transparent 70%),
    radial-gradient(ellipse 50% 60% at 75% 80%,rgba(20,60,120,.1) 0%,transparent 70%);
}

/* ============================================================
   LAYOUT
   ============================================================ */
#app{
  position:relative;z-index:1;
  max-width:480px;margin:0 auto;
  min-height:100vh;
  padding:calc(env(safe-area-inset-top,0px)) 0 calc(env(safe-area-inset-bottom,0px));
}
.screen{
  min-height:100vh;
  padding:20px 18px 40px;
  animation:fadeIn .32s ease;
}
.screen.night-screen{
  background:linear-gradient(170deg,#030108 0%,#080320 40%,#03090f 100%);
}

/* ============================================================
   ANIMATIONS
   ============================================================ */
@keyframes fadeIn   {from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slideUp  {from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes cardFlip {0%{transform:rotateY(80deg) scale(.85);opacity:0}100%{transform:rotateY(0) scale(1);opacity:1}}
@keyframes voteIn   {from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse    {0%,100%{opacity:1}50%{opacity:.4}}
@keyframes glowLoop {0%,100%{filter:drop-shadow(0 0 10px rgba(212,168,67,.6))}
                     50%{filter:drop-shadow(0 0 28px rgba(212,168,67,1))}}
@keyframes borderPulse{0%,100%{box-shadow:0 0 0 0 rgba(232,68,90,.0)}
                        50%{box-shadow:0 0 0 6px rgba(232,68,90,.15)}}
@keyframes floatUp  {0%{transform:translateY(0)}50%{transform:translateY(-6px)}100%{transform:translateY(0)}}
@keyframes msgIn    {from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes shimmer  {0%{background-position:-200% 0}100%{background-position:200% 0}}

/* ============================================================
   TYPOGRAPHY
   ============================================================ */
.serif{font-family:"Hiragino Mincho ProN","Noto Serif JP",Georgia,serif;font-weight:700;letter-spacing:.06em}
h2{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-weight:700;font-size:1.4rem;margin:.3em 0 .2em}
h3{font-size:.95rem;color:var(--dim);margin:.25em 0}
.ng{color:var(--red)}
.ok-c{color:var(--ok)}
.gold-c{color:var(--gold)}
.dim-c{color:var(--dim)}

/* ============================================================
   LOGO
   ============================================================ */
.logo-wrap{text-align:center;padding:44px 0 28px}
.logo-moon{
  display:block;font-size:4.2rem;
  animation:glowLoop 3.5s ease-in-out infinite,floatUp 4s ease-in-out infinite;
}
.logo-title{
  font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;
  font-size:2.8rem;font-weight:900;letter-spacing:.25em;
  background:linear-gradient(135deg,#c8a8f0 0%,#ece6d3 35%,#d4a843 68%,#e8445a 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 16px rgba(139,127,212,.5));
  margin-top:4px;
}
.logo-sub{color:var(--dim);font-size:.82rem;letter-spacing:.22em;margin-top:6px}
.logo-line{
  width:60px;height:1px;
  background:linear-gradient(90deg,transparent,var(--vio),transparent);
  margin:14px auto 0;
}

/* ============================================================
   SECTION LABEL
   ============================================================ */
.sec-label{
  font-size:.72rem;font-weight:700;letter-spacing:.15em;
  color:var(--dim2);text-transform:uppercase;
  margin:18px 0 6px;display:flex;align-items:center;gap:8px;
}
.sec-label::after{content:'';flex:1;height:1px;background:var(--line)}

/* ============================================================
   CARDS
   ============================================================ */
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;margin:10px 0;
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.025) 0%,transparent 55%);
  pointer-events:none;border-radius:inherit;
}
.card.vio {border-color:rgba(139,127,212,.5);background:linear-gradient(135deg,rgba(139,127,212,.08),var(--panel))}
.card.red {border-color:rgba(232,68,90,.5);background:linear-gradient(135deg,rgba(232,68,90,.08),var(--panel))}
.card.gold{border-color:rgba(212,168,67,.5);background:linear-gradient(135deg,rgba(212,168,67,.08),var(--panel))}
.card.ok  {border-color:rgba(77,191,138,.5);background:linear-gradient(135deg,rgba(77,191,138,.08),var(--panel))}
.card.cyan{border-color:rgba(59,191,212,.5);background:linear-gradient(135deg,rgba(59,191,212,.08),var(--panel))}

.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:8px}
.row:last-child{border-bottom:none}
.divider{height:1px;background:var(--line);margin:14px 0}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:block;width:100%;
  padding:15px;margin:10px 0 0;
  border:0;border-radius:13px;
  font-size:1.02rem;font-weight:700;
  font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  cursor:pointer;position:relative;overflow:hidden;
  transition:transform .13s,box-shadow .2s,opacity .15s;
  color:#fff;
}
.btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.13) 0%,transparent 55%);
  pointer-events:none;
}
.btn:active{transform:scale(.965)}
.btn:disabled{background:var(--line)!important;color:var(--dim)!important;box-shadow:none!important;cursor:default}

.btn-red {background:linear-gradient(135deg,#c0293e,var(--red));box-shadow:0 4px 18px rgba(232,68,90,.35)}
.btn-red:not(:disabled):hover{box-shadow:var(--neon-r)}
.btn-vio {background:linear-gradient(135deg,#6c5fc4,var(--vio));box-shadow:0 4px 18px rgba(139,127,212,.35)}
.btn-vio:not(:disabled):hover{box-shadow:var(--neon-v)}
.btn-gold{background:linear-gradient(135deg,#a07018,var(--gold));box-shadow:0 4px 18px rgba(212,168,67,.35);color:#160e00}
.btn-gold:not(:disabled):hover{box-shadow:var(--neon-g)}
.btn-ok  {background:linear-gradient(135deg,#2d9966,var(--ok));box-shadow:0 4px 18px rgba(77,191,138,.3);color:#001a0e}
.btn-cyan{background:linear-gradient(135deg,#1a8fa0,var(--cyan));box-shadow:0 4px 18px rgba(59,191,212,.3)}
.btn-ghost{background:var(--panel2);border:1px solid var(--line2);color:var(--moon);box-shadow:none}
.btn-ghost:hover{border-color:var(--vio)}
.btn-sm{padding:9px 16px;font-size:.88rem;margin:0}

/* ============================================================
   HOME BUTTONS
   ============================================================ */
.home-btn{
  display:flex;align-items:center;gap:16px;
  width:100%;padding:18px 20px;margin:10px 0;
  border-radius:18px;
  background:var(--panel);color:var(--moon);
  font-size:1rem;font-weight:700;
  font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  cursor:pointer;text-align:left;
  transition:border-color .2s,background .2s,box-shadow .2s,transform .13s;
  position:relative;overflow:hidden;
  border:1px solid var(--line2);
}
.home-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,transparent 55%);
  pointer-events:none;
}
.home-btn:active{transform:scale(.975)}
.home-btn.hb-create{border-color:rgba(232,68,90,.3)}
.home-btn.hb-create:hover{border-color:var(--red);box-shadow:0 0 24px rgba(232,68,90,.18),inset 0 0 40px rgba(232,68,90,.04)}
.home-btn.hb-join  {border-color:rgba(139,127,212,.3)}
.home-btn.hb-join:hover  {border-color:var(--vio);box-shadow:0 0 24px rgba(139,127,212,.18),inset 0 0 40px rgba(139,127,212,.04)}
.home-btn.hb-solo  {border-color:rgba(212,168,67,.3)}
.home-btn.hb-solo:hover  {border-color:var(--gold);box-shadow:0 0 24px rgba(212,168,67,.18),inset 0 0 40px rgba(212,168,67,.04)}
.hbi{
  font-size:1.9rem;width:50px;height:50px;
  display:flex;align-items:center;justify-content:center;
  border-radius:13px;flex-shrink:0;
}
.hb-create .hbi{background:var(--redbg);border:1px solid rgba(232,68,90,.25)}
.hb-join   .hbi{background:var(--viobg);border:1px solid rgba(139,127,212,.25)}
.hb-solo   .hbi{background:var(--goldbg);border:1px solid rgba(212,168,67,.25)}
.hbt b  {display:block;font-size:1.08rem;margin-bottom:2px}
.hbt small{color:var(--dim);font-size:.8rem;font-weight:400}
.hba{margin-left:auto;color:var(--dim);font-size:1.3rem;flex-shrink:0}

/* ============================================================
   STEP INDICATOR
   ============================================================ */
.step-bar{
  display:flex;align-items:center;gap:0;
  margin:0 0 20px;
}
.step-item{
  display:flex;align-items:center;flex:1;
}
.step-dot{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.75rem;font-weight:700;
  background:var(--panel2);border:2px solid var(--line2);color:var(--dim);
  flex-shrink:0;transition:all .2s;
}
.step-dot.done {background:var(--vio);border-color:var(--vio);color:#fff}
.step-dot.active{background:var(--vio);border-color:var(--vio2);color:#fff;box-shadow:0 0 10px rgba(139,127,212,.6)}
.step-line{flex:1;height:2px;background:var(--line2);transition:background .3s}
.step-line.done{background:var(--vio)}
.step-label{
  font-size:.7rem;color:var(--dim);margin-top:4px;text-align:center;
  position:absolute; /* reset below */
}
.step-wrap{
  display:flex;flex-direction:column;align-items:center;flex:1;
  position:relative;
}
.step-wrap:first-child .step-line-l{display:none}
.step-wrap:last-child .step-line-r{display:none}

/* ============================================================
   MODE SELECT CARDS
   ============================================================ */
.mode-card{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  flex:1;padding:20px 12px;
  border-radius:16px;border:2px solid var(--line2);
  background:var(--panel);cursor:pointer;
  transition:all .2s;text-align:center;
}
.mode-card:hover{transform:translateY(-2px)}
.mode-card.selected.online-sel{border-color:var(--cyan);background:var(--cyanbg);box-shadow:var(--neon-c)}
.mode-card.selected.offline-sel{border-color:var(--vio);background:var(--viobg);box-shadow:var(--neon-v)}
.mode-card-icon{font-size:2.4rem;filter:drop-shadow(0 0 8px rgba(255,255,255,.2))}
.mode-card b{font-size:.95rem}
.mode-card small{color:var(--dim);font-size:.76rem;line-height:1.4}

/* ============================================================
   INPUTS
   ============================================================ */
input,select,textarea{
  width:100%;padding:13px 14px;
  border-radius:12px;border:1px solid var(--line2);
  background:var(--bg2);color:var(--moon);
  font-size:1rem;
  font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  transition:border-color .2s,box-shadow .2s;
  outline:none;margin:4px 0;
}
input:focus,select:focus{border-color:var(--vio);box-shadow:0 0 0 3px rgba(139,127,212,.18)}
input::placeholder{color:var(--dim2)}
.code-input{
  font-size:2.6rem;font-weight:900;letter-spacing:.3em;text-align:center;
  padding:18px;border-radius:14px;border:2px solid var(--line2);
  background:var(--bg2);color:var(--vio2);
  font-family:"Hiragino Mincho ProN",monospace;
  transition:border-color .2s,box-shadow .2s;
}
.code-input:focus{border-color:var(--vio);box-shadow:0 0 0 4px rgba(139,127,212,.2)}

/* ============================================================
   STEPPERS
   ============================================================ */
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{min-width:2.2em;text-align:center;font-size:1.3rem}
.st-btn{
  width:36px;height:36px;border-radius:50%;
  border:1px solid var(--line2);background:var(--panel2);
  color:var(--moon);font-size:1.1rem;cursor:pointer;
  transition:border-color .15s,background .15s,box-shadow .15s;
}
.st-btn:hover{border-color:var(--vio);background:var(--viobg);box-shadow:0 0 8px rgba(139,127,212,.3)}

/* ============================================================
   TAGS
   ============================================================ */
.tag{
  display:inline-block;padding:3px 11px;
  border-radius:99px;border:1px solid var(--line2);
  font-size:.76rem;color:var(--dim);background:var(--panel);
}
.tag.red {border-color:var(--red);color:var(--red);background:var(--redbg)}
.tag.vio {border-color:var(--vio);color:var(--vio2);background:var(--viobg)}
.tag.gold{border-color:var(--gold);color:var(--gold);background:var(--goldbg)}
.tag.ok  {border-color:var(--ok);color:var(--ok);background:var(--okbg)}
.tag.cyan{border-color:var(--cyan);color:var(--cyan);background:var(--cyanbg)}

/* ============================================================
   ROOM CODE DISPLAY
   ============================================================ */
.room-code-big{
  font-family:"Hiragino Mincho ProN",monospace;
  font-size:3.4rem;font-weight:900;letter-spacing:.3em;text-align:center;
  color:var(--vio2);text-shadow:var(--neon-v);
  padding:18px 0;
  background:linear-gradient(135deg,rgba(139,127,212,.1),rgba(139,127,212,.04));
  border:1px solid rgba(139,127,212,.4);border-radius:16px;margin:10px 0;
  cursor:pointer;transition:box-shadow .2s;
}
.room-code-big:hover{box-shadow:var(--neon-v)}
.qr-wrap{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:20px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:10px 0;
}
.qr-wrap img{border-radius:10px;background:#fff;padding:8px;box-shadow:0 0 20px rgba(0,0,0,.5)}

/* ============================================================
   TOGGLE SWITCH
   ============================================================ */
.role-toggle{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid var(--line);
}
.role-toggle:last-child{border-bottom:none}
.toggle-sw{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle-sw input{opacity:0;width:0;height:0}
.toggle-sl{
  position:absolute;inset:0;background:var(--line2);border-radius:24px;
  cursor:pointer;transition:background .2s;
}
.toggle-sl::before{
  content:'';position:absolute;left:3px;top:3px;
  width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s;
}
.toggle-sw input:checked+.toggle-sl{background:var(--vio)}
.toggle-sw input:checked+.toggle-sl::before{transform:translateX(20px)}

/* ============================================================
   CHIPS / ALIVE LIST
   ============================================================ */
.alive-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{
  padding:4px 12px;border-radius:99px;
  border:1px solid var(--line2);background:var(--panel2);
  font-size:.82rem;color:var(--moon);
}
.chip.dead{background:transparent;color:var(--dim2);text-decoration:line-through;border-style:dashed;opacity:.5}

/* ============================================================
   CHAT / LOG
   ============================================================ */
.chat-box,.log-box{
  overflow-y:auto;
  display:flex;flex-direction:column;gap:5px;
  padding:6px 0;scroll-behavior:smooth;
}
.chat-box{max-height:200px}
.log-box {max-height:290px}
.chat-box::-webkit-scrollbar,.log-box::-webkit-scrollbar{width:3px}
.chat-box::-webkit-scrollbar-thumb,.log-box::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}

.msg{
  background:var(--panel2);
  border-left:3px solid var(--vio);
  border-radius:0 10px 10px 0;
  padding:7px 12px;font-size:.92rem;
  animation:msgIn .22s ease;
}
.msg.wolf-msg{border-left-color:var(--red);background:rgba(232,68,90,.06)}
.msg.sys{border-left-color:var(--gold);background:var(--goldbg);font-style:italic}
.msg.me{border-left-color:var(--cyan);background:rgba(59,191,212,.07)}
.msg small{display:block;color:var(--dim);font-size:.7rem;margin-bottom:1px}
.send-row{display:flex;gap:8px;margin-top:8px}
.send-row input{flex:1}
.send-row button{
  padding:0 18px;border-radius:12px;border:0;
  background:var(--vio);color:#fff;font-weight:700;
  cursor:pointer;font-size:.95rem;flex-shrink:0;
  transition:box-shadow .2s;
}
.send-row button:hover{box-shadow:var(--neon-v)}

/* ============================================================
   DAY HEADER / BADGE
   ============================================================ */
.day-header{
  display:flex;align-items:center;gap:12px;
  padding:12px 0;margin-bottom:10px;
  border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.day-badge{
  font-size:.78rem;font-weight:700;padding:4px 12px;border-radius:99px;
  background:var(--goldbg);border:1px solid rgba(212,168,67,.4);color:var(--gold);
}

/* ============================================================
   TIMER RING
   ============================================================ */
.timer-ring{position:relative;width:54px;height:54px}
.timer-ring svg{transform:rotate(-90deg)}
.tr-bg{fill:none;stroke:var(--line2);stroke-width:5}
.tr-arc{fill:none;stroke:var(--vio);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .95s linear,stroke .4s}
.tr-arc.low{stroke:var(--red);animation:pulse .8s infinite}
.timer-text{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:"Hiragino Mincho ProN",serif;font-size:.95rem;font-weight:700;
}
.timer-text.low{color:var(--red)}

/* ============================================================
   COMPLETE BUTTON (議論完了)
   ============================================================ */
.done-btn-wrap{
  display:flex;flex-direction:column;align-items:stretch;gap:6px;
  background:var(--panel2);border:1px solid var(--line2);
  border-radius:14px;padding:14px;margin-top:12px;
}
.done-count{
  text-align:center;font-size:.82rem;color:var(--dim);margin-bottom:4px;
}
.done-count b{color:var(--ok)}

/* ============================================================
   PLAYER LIST / PICK
   ============================================================ */
.player-list{display:grid;gap:8px;margin:10px 0}
.player-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:13px;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;
  transition:border-color .15s,background .15s,transform .1s,box-shadow .15s;
}
.player-item:hover{border-color:var(--line2);background:var(--panel2)}
.player-item.on{border-color:var(--red);background:var(--redbg);transform:scale(1.01);box-shadow:0 0 12px rgba(232,68,90,.2)}
.player-item.on.vio-sel{border-color:var(--vio);background:var(--viobg);box-shadow:0 0 12px rgba(139,127,212,.2)}
.player-avatar{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;background:var(--panel2);border:1px solid var(--line2);flex-shrink:0;
}
.player-name{font-weight:600;font-size:.95rem}

/* ============================================================
   VOTE BAR
   ============================================================ */
.vote-result{display:grid;gap:8px;margin:10px 0}
.vote-row{display:flex;align-items:center;gap:10px}
.vote-name{min-width:76px;font-size:.88rem;font-weight:600}
.vote-bar-wrap{flex:1;height:20px;background:var(--panel2);border-radius:99px;overflow:hidden}
.vote-bar{height:100%;border-radius:99px;transform-origin:left;animation:voteIn .8s cubic-bezier(.15,1.4,.4,1)}
.vote-count{min-width:22px;text-align:right;font-size:.88rem;color:var(--dim)}

/* ============================================================
   ROLE CARD
   ============================================================ */
.role-card{
  display:flex;flex-direction:column;align-items:center;
  padding:32px 20px;border-radius:24px;border:2px solid var(--line2);
  background:var(--panel);margin:14px 0;
  animation:cardFlip .5s cubic-bezier(.2,.8,.3,1.1);
  position:relative;overflow:hidden;
}
.role-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.07) 0%,transparent 65%);
  pointer-events:none;
}
.role-card.wolf  {border-color:rgba(232,68,90,.6);background:linear-gradient(160deg,#1a0608,#111428)}
.role-card.spy   {border-color:rgba(139,127,212,.6);background:linear-gradient(160deg,#0c0918,#111428)}
.role-card.seer  {border-color:rgba(212,168,67,.6);background:linear-gradient(160deg,#161000,#111428)}
.role-card.knight{border-color:rgba(77,191,138,.6);background:linear-gradient(160deg,#001409,#111428)}
.role-card.citizen{border-color:var(--line2)}
.rc-icon{font-size:4.6rem;margin-bottom:12px;filter:drop-shadow(0 0 14px currentColor)}
.rc-name{font-size:2rem;font-weight:900;font-family:"Hiragino Mincho ProN",serif;margin-bottom:6px}
.role-card.wolf .rc-name{color:var(--red);text-shadow:var(--neon-r)}
.role-card.spy  .rc-name{color:var(--vio2);text-shadow:var(--neon-v)}
.role-card.seer .rc-name{color:var(--gold2);text-shadow:var(--neon-g)}
.role-card.knight .rc-name{color:var(--ok2)}
.role-card.citizen .rc-name{color:var(--moon)}
.rc-desc{color:var(--dim);font-size:.88rem;text-align:center;max-width:280px;line-height:1.6}

/* ============================================================
   NIGHT TITLE
   ============================================================ */
.night-title{
  font-size:2.1rem;text-align:center;
  color:var(--vio2);text-shadow:var(--neon-v);margin:10px 0;
  font-family:"Hiragino Mincho ProN",serif;
}
.big-emoji{
  font-size:4.8rem;margin:8px 0;
  filter:drop-shadow(0 0 18px rgba(255,255,255,.25));
}

/* ============================================================
   RESULT
   ============================================================ */
.result-big{
  font-size:3.2rem;font-weight:900;
  font-family:"Hiragino Mincho ProN",serif;margin:10px 0;
}
.result-big.win {color:var(--ok2);text-shadow:0 0 20px rgba(77,191,138,.6),0 0 40px rgba(77,191,138,.3)}
.result-big.lose{color:var(--red);text-shadow:var(--neon-r);animation:pulse 2s infinite}

/* ============================================================
   TABLE
   ============================================================ */
.ptable{width:100%;border-collapse:collapse;margin:6px 0}
.ptable td{padding:8px 6px;border-bottom:1px solid var(--line);font-size:.88rem}
.ptable td:first-child{color:var(--dim);font-size:.78rem;width:40px}

/* ============================================================
   CENTER LAYOUT
   ============================================================ */
.center{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:8px;padding:20px;min-height:65vh;
}

/* ============================================================
   TOAST
   ============================================================ */
#toast{
  position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%) translateY(80px);
  background:rgba(20,22,44,.95);border:1px solid var(--line2);
  color:var(--moon);font-size:.88rem;
  padding:10px 22px;border-radius:99px;
  box-shadow:0 4px 28px rgba(0,0,0,.6);
  transition:transform .28s cubic-bezier(.2,1.5,.4,1),opacity .25s;
  opacity:0;pointer-events:none;z-index:999;white-space:nowrap;
}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* scrollbar global */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
'use strict';
/* ============================================================
   WEREWOLF v3 — Single HTML
   ============================================================ */
const app = document.getElementById('app');
const e  = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R  = h => { app.innerHTML = h; window.scrollTo(0,0); };
const rand = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => {
  a=[...a];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
};
const pad = n => String(n).padStart(2,'0');
const qs  = s => document.querySelector(s);
const qsa = s => [...document.querySelectorAll(s)];

function toast(msg,ms=2200){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),ms);
}
function copyText(txt){
  navigator.clipboard?.writeText(txt).then(()=>toast('📋 コピーしました'));
}

/* ============================================================  CONSTANTS */
const RN = {citizen:'市民',wolf:'人狼',spy:'スパイ',seer:'占い師',knight:'騎士'};
const RI = {citizen:'🏠',wolf:'🐺',spy:'🕵️',seer:'🔮',knight:'🛡️'};
const RD = {
  citizen:'特殊な力はありません。議論と推理で人狼を見つけ出しましょう。',
  wolf:'毎晩1人を襲撃します。スパイと夜に密談できます。',
  spy:'人狼が誰かを知っています。夜は人狼と密談できます。人狼陣営として勝利を目指します。',
  seer:'毎晩1人を占い、人狼かどうかを知ることができます。',
  knight:'毎晩1人を人狼の襲撃から守ります（自分以外）。',
};
const RCOL = {wolf:'wolf',spy:'spy',seer:'seer',knight:'knight',citizen:'citizen'};
const BOT_NAMES = ['アキラ','ユウキ','ハルカ','ミツキ','リオン','サクラ','ケンジ','ナナミ','タクミ','アオイ'];
const AVATARS   = ['😀','😎','🧐','🤔','😶','🥸','🤓','🧑','👤','🫥'];

/* ============================================================  STATE */
let S = {
  mode:'home',            // home | solo | room | join
  roomType:'offline',     // offline | online
  humans:3, bots:2,
  names:[],
  roles:{seer:true,knight:false},
};
let G = null;

/* ============================================================
   HOME
   ============================================================ */
function home(){
  S.mode='home';
  const params = new URLSearchParams(location.search);
  const rp = params.get('room');
  if(rp){ history.replaceState({},'',location.pathname); setTimeout(()=>joinRoomAuto(rp),100); return; }

  R(`<div class="screen">
    <div class="logo-wrap">
      <span class="logo-moon">🌕</span>
      <div class="logo-title serif">WEREWOLF</div>
      <div class="logo-sub">深夜の推理ゲーム</div>
      <div class="logo-line"></div>
    </div>

    <button class="home-btn hb-create" onclick="roomCreate()">
      <span class="hbi">🏠</span>
      <span class="hbt"><b>ルームを作る</b><small>オンライン / オフライン対談を選択して部屋を作成</small></span>
      <span class="hba">›</span>
    </button>
    <button class="home-btn hb-join" onclick="joinScreen()">
      <span class="hbi">🚪</span>
      <span class="hbt"><b>参加する</b><small>5桁コードまたはQRで入室</small></span>
      <span class="hba">›</span>
    </button>
    <button class="home-btn hb-solo" onclick="soloSetup()">
      <span class="hbi">🤖</span>
      <span class="hbt"><b>一人でやる</b><small>強化AI Botと対戦するソロモード</small></span>
      <span class="hba">›</span>
    </button>

    <div style="text-align:center;margin-top:36px">
      <span style="color:var(--dim2);font-size:.74rem">v3.0 — フロントエンドのみで動作</span>
    </div>
  </div>`);
}

/* ============================================================
   ROOM CREATE — 3 STEPS
   Step 1: オンライン/オフライン選択
   Step 2: 人数・役職設定
   Step 3: QRコード表示
   ============================================================ */
function stepBar(active){
  // active: 1,2,3
  const labels=['方式選択','人数設定','QRコード'];
  const items = labels.map((lb,i)=>{
    const n=i+1;
    const cls = n<active?'done':n===active?'active':'';
    const lineCls = n<active?'done':'';
    return `<div class="step-wrap">
      ${n>1?`<div class="step-line ${lineCls}" style="flex:1"></div>`:'<div style="flex:1"></div>'}
      <div style="display:flex;flex-direction:column;align-items:center">
        <div class="step-dot ${cls}">${n<active?'✓':n}</div>
        <div style="font-size:.68rem;color:${n===active?'var(--vio2)':'var(--dim2)'};margin-top:3px;white-space:nowrap">${lb}</div>
      </div>
      ${n<labels.length?`<div class="step-line ${n<active?'done':''}" style="flex:1"></div>`:'<div style="flex:1"></div>'}
    </div>`;
  }).join('');
  return `<div class="step-bar" style="margin:0 0 20px">${items}</div>`;
}

function roomCreate(){
  // Step 1
  R(`<div class="screen">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <button class="btn btn-ghost btn-sm" style="width:auto" onclick="home()">← 戻る</button>
      <h2 style="margin:0">ルームを作る</h2>
    </div>
    ${stepBar(1)}

    <p class="sec-label">対戦方式を選ぶ</p>
    <div style="display:flex;gap:12px;margin-bottom:20px">
      <div class="mode-card online-sel ${S.roomType==='online'?'selected':''}" id="mc-online" onclick="selRoomType('online')">
        <div class="mode-card-icon">📡</div>
        <b>オンライン</b>
        <small>QRコードやURLで離れた場所の友達と遊ぶ</small>
      </div>
      <div class="mode-card offline-sel ${S.roomType==='offline'?'selected':''}" id="mc-offline" onclick="selRoomType('offline')">
        <div class="mode-card-icon">🤝</div>
        <b>オフライン対談</b>
        <small>同じ場所に集まって対面で遊ぶ</small>
      </div>
    </div>

    <div class="card" id="rt-desc" style="margin-bottom:8px"></div>

    <button class="btn btn-vio" onclick="roomStep2()">次へ：人数設定 →</button>
  </div>`);
  updateRoomTypeDesc();
}

function selRoomType(t){
  S.roomType=t;
  qsa('.mode-card').forEach(c=>c.classList.remove('selected'));
  qs(t==='online'?'#mc-online':'#mc-offline').classList.add('selected');
  updateRoomTypeDesc();
}
function updateRoomTypeDesc(){
  const el=qs('#rt-desc'); if(!el)return;
  if(S.roomType==='online'){
    el.innerHTML=`<div class="tag cyan" style="margin-bottom:8px">📡 オンライン</div>
    <p style="font-size:.88rem;color:var(--dim)">QRコード・URLで離れた場所の友達に共有します。<br>各自のスマホで役職確認・投票を行います。</p>`;
  } else {
    el.innerHTML=`<div class="tag vio" style="margin-bottom:8px">🤝 オフライン対談</div>
    <p style="font-size:.88rem;color:var(--dim)">同じ場所に集まって対面で遊びます。<br>役職確認・夜行動・投票をそれぞれ行います。</p>`;
  }
}

function roomStep2(){
  // Step 2
  R(`<div class="screen">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <button class="btn btn-ghost btn-sm" style="width:auto" onclick="roomCreate()">← 戻る</button>
      <h2 style="margin:0">人数・役職設定</h2>
    </div>
    ${stepBar(2)}

    <p class="sec-label">プレイヤー人数</p>
    <div class="card">
      <div class="row">
        <span>人間プレイヤー</span>
        <span class="stepper">
          <button class="st-btn" onclick="adjH(-1)">−</button>
          <b id="hv">${S.humans}</b>
          <button class="st-btn" onclick="adjH(1)">＋</button>
        </span>
      </div>
      <div class="row">
        <span>AI Bot</span>
        <span class="stepper">
          <button class="st-btn" onclick="adjB(-1)">−</button>
          <b id="bv">${S.bots}</b>
          <button class="st-btn" onclick="adjB(1)">＋</button>
        </span>
      </div>
      <div class="row" style="border:none;padding-bottom:0">
        <span id="total-note" style="font-size:.86rem"></span>
      </div>
    </div>

    <p class="sec-label">役職設定</p>
    <div class="card">
      <div class="role-toggle">
        <span>🔮 占い師</span>
        <label class="toggle-sw"><input type="checkbox" id="r-seer" ${S.roles.seer?'checked':''}><span class="toggle-sl"></span></label>
      </div>
      <div class="role-toggle">
        <span>🛡️ 騎士</span>
        <label class="toggle-sw"><input type="checkbox" id="r-knight" ${S.roles.knight?'checked':''}><span class="toggle-sl"></span></label>
      </div>
      <div style="padding:8px 0 0;font-size:.8rem;color:var(--dim)">※ スパイと人狼は必ず含まれます</div>
    </div>

    <p class="sec-label">プレイヤー名</p>
    <div class="card" id="name-inputs">${buildNameInputs()}</div>

    <button class="btn btn-vio" id="step2-next" onclick="roomStep3()">次へ：QRコード生成 →</button>
  </div>`);
  updateTotalNote();
  qs('#r-seer').onchange=ev=>{S.roles.seer=ev.target.checked};
  qs('#r-knight').onchange=ev=>{S.roles.knight=ev.target.checked};
}

function buildNameInputs(){
  return Array.from({length:S.humans},(_,i)=>
    `<input maxlength="8" placeholder="プレイヤー${i+1}" value="${e(S.names[i]||'')}" oninput="S.names[${i}]=this.value" style="margin:4px 0">`
  ).join('');
}
function adjH(d){
  S.humans=Math.min(8,Math.max(1,S.humans+d));
  qs('#hv').textContent=S.humans;
  qs('#name-inputs').innerHTML=buildNameInputs();
  updateTotalNote();
}
function adjB(d){
  S.bots=Math.min(6,Math.max(0,S.bots+d));
  qs('#bv').textContent=S.bots;
  updateTotalNote();
}
function updateTotalNote(){
  const t=S.humans+S.bots, ok=t>=4&&t<=8;
  const el=qs('#total-note');
  if(el) el.innerHTML=`<span class="${ok?'ok-c':'ng'}">合計 ${t} 人　${ok?'✓ OK':'4〜8人で遊べます'}</span>`;
  const nb=qs('#step2-next');
  if(nb) nb.disabled=!ok;
}

function roomStep3(){
  const t=S.humans+S.bots;
  if(t<4||t>8){toast('4〜8人で遊べます');return;}

  // オンライン・オフライン両方ともコードを生成し localStorage に保存
  const code    = genCode();
  const baseUrl = location.href.split('?')[0];
  const roomUrl = `${baseUrl}?room=${code}`;
  const qrUrl   = `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(roomUrl)}&size=200x200&bgcolor=ffffff&color=000000&qzone=2`;

  // ルーム設定を localStorage に保存（参加者がコード入力時に読み込む）
  const roomData = {
    code,
    roomType: S.roomType,
    humans: S.humans,
    bots: S.bots,
    names: [...S.names],
    roles: {...S.roles},
    createdAt: Date.now(),
  };
  try { localStorage.setItem('ww_room_' + code, JSON.stringify(roomData)); } catch(_){}

  const isOnline = S.roomType === 'online';
  const roleLabel = [S.roles.seer?'🔮占い師':'', S.roles.knight?'🛡️騎士':''].filter(Boolean).join(' ') || '基本のみ';

  R(`<div class="screen">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <button class="btn btn-ghost btn-sm" style="width:auto" onclick="roomStep2()">← 戻る</button>
      <h2 style="margin:0">${isOnline ? 'QRコード' : 'ルームコード'}</h2>
    </div>
    ${stepBar(3)}

    <p class="sec-label">暗唱番号（ルームコード）</p>
    <div class="room-code-big" onclick="copyText('${code}')" title="タップでコピー">${code}</div>
    <p style="text-align:center;color:var(--dim);font-size:.82rem;margin-bottom:8px">
      ${isOnline ? 'タップでコピー — 友達にこのコードを教えてください' : 'この番号を参加者に口頭で伝えてください'}
    </p>

    ${isOnline ? `
    <p class="sec-label">QRコード / URL</p>
    <div class="qr-wrap">
      <img src="${e(qrUrl)}" width="200" height="200" alt="QR" loading="lazy">
      <div style="font-size:.78rem;color:var(--dim);text-align:center;word-break:break-all;max-width:320px">${e(roomUrl)}</div>
      <button class="btn btn-ghost btn-sm" style="width:auto;margin-top:4px" onclick="copyText('${e(roomUrl).replace(/'/g,"\\'")}')">🔗 URLをコピー</button>
    </div>
    ` : `
    <div class="card vio" style="margin-bottom:4px">
      <p style="font-size:.88rem;color:var(--vio2);margin:0">
        🤝 <b>オフライン対談</b><br>
        参加者は「参加する」からこのコードを入力して入室できます。<br>
        ホスト（あなた）は「ゲーム開始」を押してください。
      </p>
    </div>
    `}

    <div class="card" style="margin-top:6px">
      <div class="row"><span>方式</span><span class="tag ${isOnline?'cyan':'vio'}">${isOnline?'📡 オンライン':'🤝 オフライン'}</span></div>
      <div class="row"><span>合計人数</span><span>${S.humans+S.bots} 人</span></div>
      <div class="row"><span>人間 / Bot</span><span>${S.humans} / ${S.bots}</span></div>
      <div class="row" style="border:none"><span>役職</span><span style="font-size:.85rem">${roleLabel}</span></div>
    </div>

    <button class="btn btn-red" style="margin-top:8px" onclick="startFromRoom('${code}')">🐺 ゲーム開始 → 待機所へ</button>
  </div>`);
}

function genCode(){ return String(Math.floor(10000+Math.random()*90000)); }

// ルーム作成後の「ゲーム開始」
// code は roomStep3 で生成済みのものを渡す
function startFromRoom(code){
  const t=S.humans+S.bots;
  if(t<4||t>8){toast('4〜8人で遊べます');return;}
  S.mode='room';
  startGame(true, code);
}

/* ============================================================
   JOIN SCREEN
   ============================================================ */
function joinScreen(){
  R(`<div class="screen">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
      <button class="btn btn-ghost btn-sm" style="width:auto" onclick="home()">← 戻る</button>
      <h2 style="margin:0">ルームに参加</h2>
    </div>

    <div class="card vio" style="margin-bottom:16px">
      <p style="font-size:.88rem;color:var(--vio2);margin:0">
        🔑 ホストから教わった <b>5桁の暗唱番号（ルームコード）</b> を入力してください。<br>
        オンライン・オフラインどちらでも同じコードで入室できます。
      </p>
    </div>

    <p class="sec-label">暗唱番号を入力</p>
    <input class="code-input" id="join-code" maxlength="5" placeholder="12345"
      oninput="this.value=this.value.replace(/\\D/g,'');checkJoinCode()"
      style="text-align:center">

    <div id="join-preview" style="margin-top:10px"></div>

    <button class="btn btn-vio" id="join-btn" onclick="doJoin()" disabled>入室する →</button>

    <div class="divider"></div>
    <p style="text-align:center;color:var(--dim);font-size:.82rem">
      QRコードを読み取った場合は自動的に入室されます
    </p>
  </div>`);
}

function checkJoinCode(){
  const c = qs('#join-code')?.value.trim();
  const btn = qs('#join-btn');
  const preview = qs('#join-preview');
  if(!btn||!preview)return;

  if(c?.length===5){
    btn.disabled=false;
    // localStorage にルームデータがあれば設定をプレビュー表示
    try{
      const raw = localStorage.getItem('ww_room_'+c);
      if(raw){
        const d = JSON.parse(raw);
        const age = Math.floor((Date.now()-d.createdAt)/60000);
        const roleLabel=[d.roles?.seer?'🔮占い師':'',d.roles?.knight?'🛡️騎士':''].filter(Boolean).join(' ')||'基本のみ';

/* ============================================================
   GAME START
   ============================================================ */
function buildRoles(total){
  // 3人特殊ルール: 市民と人狼だけ、かつ人狼ゼロの可能性あり（完全ランダム）
  if(total===3){
    // wolf が出るかどうか自体をランダムに（1/3の確率でwolfなし）
    const hasWolf = Math.random() > 0.33;
    const roles = hasWolf ? ['wolf','citizen','citizen'] : ['citizen','citizen','citizen'];
    return shuffle(roles);
  }
  const roles=['wolf','spy'];
  if(total>=7) roles.push('wolf');
  if(S.roles.seer)  roles.push('seer');
  if(S.roles.knight)roles.push('knight');
  while(roles.length<total) roles.push('citizen');
  return shuffle(roles).slice(0,total);
}

function startGame(viaLobby=false, roomCode=''){
  const total=S.humans+S.bots;
  if(total<4||total>8){toast('4〜8人で遊べます');return;}
  const roles=buildRoles(total);
  const usedBotNames=shuffle([...BOT_NAMES]);
  const players=[];
  for(let i=0;i<total;i++){
    const isBot=i>=S.humans;
    const name=isBot
      ? usedBotNames[i-S.humans]
      : ((S.names[i]||'').trim()||`プレイヤー${i+1}`);
    players.push({id:i,bot:isBot,alive:true,role:roles[i],name,coRole:null});
  }
  G={
    players,night:0,day:0,
    chat:[],dayLog:[],seerResults:[],
    actions:{kill:null,protect:null},
    votes:{},
    timers:{iv:null,to:null,bots:[]},
    soloMode: S.mode==='solo',
    doneSet: new Set(),
    extVotes:{yes:0,no:0,asked:false},
    _roomCode: roomCode,
  };
  const humanPlayers=G.players.filter(p=>!p.bot);
  if(humanPlayers.length===0){ nightPhase(); return; }

  // ロビー経由（ルーム作成時）→ 待機所 → 全員同時に役職確認
  if(viaLobby){
    showLobby();
    return;
  }

  // ソロモード → 役職確認（手渡し不要、自分1人）
  showRoleRevealAll(()=>{
    if(G.players.length===3 && G.players.every(p=>p.role!=='wolf')){
      show3pNowolf();
    } else {
      nightPhase();
    }
  });
}

/* ============================================================
   NIGHT PHASE
   ============================================================ */
function nightPhase(){
  clearTimers();
  G.night++;
  G.actions={kill:null,protect:null};
  const isSoloFirstNight = G.soloMode && G.night===1;
  const is3player = G.players.length === 3; // 3人ルール: 夜の人狼行動なし

  const alivePlayers=alive();

  // ── Bot夜行動 ──
  G.players.filter(p=>p.bot&&p.alive).forEach(b=>{
    if(b.role==='wolf'){
      // 3人ゲームは夜の襲撃なし
      if(is3player) return;
      // ソロモード初日夜はプレイヤー（人間）を狙わない
      let targets = alivePlayers.filter(x=>x.id!==b.id&&x.role!=='spy'&&x.role!=='wolf');
      if(isSoloFirstNight) targets = targets.filter(x=>x.bot); // Bot同士だけ
      if(targets.length){
        G.actions.kill=rand(targets).id;
        const mate=G.players.find(x=>x.role==='spy'&&x.alive);
        if(mate) addNightChat(b.name,`今夜は ${G.players[G.actions.kill].name} さんを消そう。どう思う？`,'wolf');
      }
    }
    if(b.role==='spy'){
      const ws=G.players.filter(x=>x.role==='wolf'&&x.alive&&x.bot);
      if(ws.length) addNightChat(b.name,'了解。昼は怪しまれないように動くね。','wolf');
    }
    if(b.role==='knight'){
      const tg=alivePlayers.filter(x=>x.id!==b.id);
      if(tg.length) G.actions.protect=rand(tg).id;
    }
    if(b.role==='seer'){
      const tg=alivePlayers.filter(x=>x.id!==b.id&&!G.seerResults.find(r=>r.id===x.id));
      if(tg.length){
        const t=rand(tg);
        G.seerResults.push({id:t.id,name:t.name,result:t.role==='wolf'?'wolf':'white',night:G.night,by:b.name});
      }
    }
  });

  const humanNight=G.players.filter(p=>!p.bot&&p.alive);
  if(humanNight.length===0) return resolveNight();
  showNightIntro(()=>passDevice(humanNight,0,`夜${G.night}`,showNightAction,resolveNight));
}

      window._pg=next;
    },logHtml);
    return;
  }

  if(p.role==='knight'){
    renderPickTarget('🛡️ 騎士 — 守る相手を選ぶ',others,'守る','ok',
      id=>{G.actions.protect=id;next()});
    return;
  }

  // wolf / spy
  const isSpy=p.role==='spy';
  const mate=G.players.find(x=>x.alive&&x.role===(isSpy?'wolf':'spy'));
  // 3人ゲームは夜の襲撃なし
  const is3p = G.players.length === 3;
  const killTargets=(!is3p && p.role==='wolf')?others.filter(x=>x.role!=='spy'&&x.role!=='wolf'):[];
  let selKill=null;

  const chatHtml=()=>G.chat.map(m=>
    `<div class="msg wolf-msg"><small>${e(m.from)} · 夜${m.n}</small>${e(m.text)}</div>`
  ).join('')||'<div class="msg sys"><small>システム</small>まだ会話はありません…</div>';

  const killHtml=killTargets.length
    ?`<p class="sec-label">☠️ 今夜の襲撃対象</p>
      <div class="player-list" id="kill-list">
        ${killTargets.map(t=>`<div class="player-item" data-id="${t.id}" onclick="selKillFn(${t.id},this)"><div class="player-avatar">${AVATARS[t.id%10]}</div><span class="player-name">${e(t.name)}</span></div>`).join('')}
      </div>`:'';

  R(`<div class="screen night-screen">
    <div style="display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid rgba(232,68,90,.2);margin-bottom:10px">
      <span class="tag red">${RI[p.role]} ${RN[p.role]}の夜</span>
      <span style="color:var(--dim);font-size:.84rem">夜${G.night}</span>
    </div>
    ${mate?`
    <p class="sec-label">🔒 ${e(mate.name)} さんとの密談</p>
    <div class="card" style="padding:12px">
      <div class="chat-box" id="night-chat">${chatHtml()}</div>
      <div class="send-row">
        <input id="chat-inp" maxlength="60" placeholder="メッセージを送る…">
        <button onclick="sendNightChat(${p.id},${mate.id})">送信</button>
      </div>
    </div>`:'<p style="color:var(--dim);font-size:.88rem">密談できる相手はいません</p>'}
    ${killHtml}
    <button class="btn btn-red" id="night-done" ${killTargets.length?'disabled':''} onclick="window._pg()">
      ${p.role==='wolf'?'完了 →':'次へ →'}
    </button>
  </div>`);
  scrollEl('night-chat');

  window.selKillFn=(id,el)=>{
    selKill=id;
    qsa('#kill-list .player-item').forEach(x=>x.classList.toggle('on',x===el));
    qs('#night-done').disabled=false;
  };
  window.sendNightChat=(fromId,toId)=>{
    const inp=qs('#chat-inp');
    const v=inp.value.trim();if(!v)return;
    addNightChat(G.players[fromId].name,v);
    if(G.players[toId]?.bot){
      const reply=genBotNightChat(G.players[toId],G.players[fromId]);
      if(reply) setTimeout(()=>{
        addNightChat(G.players[toId].name,reply,'wolf');
        const c=qs('#night-chat');
        if(c){c.innerHTML=chatHtml();scrollEl('night-chat');}
      },700+Math.random()*600);
    }
    inp.value='';
    const c=qs('#night-chat');
    if(c){c.innerHTML=chatHtml();scrollEl('night-chat');}
  };
  window._pg=()=>{
    if(p.role==='wolf'&&selKill!==null) G.actions.kill=selKill;
    next();
  };
}

function genBotNightChat(bot,other){
  const tgt=G.actions.kill!==null?G.players[G.actions.kill]:null;
  const lines=[
    tgt?`今夜は ${tgt.name} さんを消そう。昼は疑いを向けないようにして。`:'作戦を立てよう。占い師を警戒して。',
    `${other.name} さん、昼はうまく市民を誘導して。`,
    '了解。自然に振る舞うよ。昼は積極的に発言しよう。',
    '投票は流れに乗って。絶対に同士を売らないで。',
    '占い師が誰かを特定しないといけない。',
  ];
  return rand(lines);
}

function renderPickTarget(title,targets,label,colorClass,cb,extraHtml=''){
  let sel=null;
  R(`<div class="screen night-screen">
    <h2 style="margin-bottom:12px">${title}</h2>
    ${extraHtml}
    <div class="player-list" id="pick-list">
      ${targets.map(t=>`<div class="player-item ${colorClass==='vio'?'vio-sel':''}" data-id="${t.id}" onclick="pickSelFn(${t.id},this)">
        <div class="player-avatar">${AVATARS[t.id%10]}</div>
        <span class="player-name">${e(t.name)}</span>
      </div>`).join('')}
    </div>
    <button class="btn btn-${colorClass}" id="pick-ok" disabled>${label}</button>
  </div>`);
  window.pickSelFn=(id,el)=>{
    sel=id;
    qsa('#pick-list .player-item').forEach(x=>x.classList.toggle('on',x===el));
    qs('#pick-ok').disabled=false;
  };
  qs('#pick-ok').onclick=()=>cb(sel);
}

/* ============================================================
   RESOLVE NIGHT
   ============================================================ */
function resolveNight(){
  const k=G.actions.kill;
  let msg='昨夜は誰も襲撃されませんでした。平和な朝です。';
  if(k!==null&&k!==G.actions.protect){
    G.players[k].alive=false;
    msg=`昨夜、${G.players[k].name} さんが無残にも倒れていました…`;
  }
  const w=checkWinner();
  if(w) return showResult(w,msg);
  dayPhase(msg);
}

/* ============================================================
   DAY PHASE
   ─ タイマー残り表示のみ（自動終了しない）
   ─ 全員の「完了」ボタンで進行
   ─ 半数以上「延長」で+2分
   ============================================================ */
function dayPhase(nightMsg){
  clearTimers();
  G.day++;
  G.dayLog=[];
  G.doneSet=new Set();
  G.extVotes={yes:0,no:0,asked:false};

  const humanAlive=G.players.filter(p=>!p.bot&&p.alive);
  const humanCount=humanAlive.length;
  const botPool   =alive().filter(p=>p.bot);
  const mePlayer  =G.soloMode ? G.players.find(p=>!p.bot&&p.alive) : null;
  const totalSec  =120;
  let elapsed=0;

  const msgHtml=m=>`<div class="msg${m.isMe?' me':''}"><small>${e(m.from)}</small>${e(m.text)}</div>`;

  const updateDoneUI=()=>{
    const el=qs('#done-count'); if(!el)return;
    el.innerHTML=`<b>${G.doneSet.size}</b> / ${humanCount} 人が完了`;
    const btn=qs('#done-btn');
    if(btn){
      const alreadyDone=mePlayer&&G.doneSet.has(mePlayer.id);
      btn.textContent=alreadyDone?'✓ 完了済み':'✅ 話し合い完了';
      btn.disabled=alreadyDone;
      if(alreadyDone) btn.style.background='var(--line)';
    }
    if(G.doneSet.size>=humanCount&&humanCount>0&&!G.extVotes.asked){
      askExtension();
    }
  };

  const r22=2*Math.PI*22;
  function buildScreen(){
    return `<div class="screen">
      <div class="day-header">
        <span class="day-badge">☀️ ${G.day}日目</span>
        <div class="timer-ring" style="margin-left:auto">
          <svg width="54" height="54" viewBox="0 0 54 54">
            <circle class="tr-bg" cx="27" cy="27" r="22"/>
            <circle class="tr-arc" id="tr-arc" cx="27" cy="27" r="22"
              stroke-dasharray="${r22}" stroke-dashoffset="0"/>
          </svg>
          <div class="timer-text" id="timer-txt">2:00</div>
        </div>
      </div>

      <div class="card red" style="margin-bottom:10px">
        <div style="font-weight:600;font-size:.94rem">${e(nightMsg)}</div>
      </div>

      <p class="sec-label">生存者</p>
      <div class="alive-chips">
        ${alive().map(p=>`<div class="chip">${e(p.name)}</div>`).join('')}
      </div>

      <p class="sec-label">議論ログ</p>
      <div class="card" style="padding:10px 12px">
        <div class="log-box" id="day-log">
          <div id="empty-log" class="msg sys"><small>システム</small>議論が始まります…</div>
        </div>
      </div>

      ${G.soloMode?`
      <div class="send-row" style="margin-top:8px">
        <input id="day-inp" maxlength="80" placeholder="あなたの発言…"
          onkeydown="if(event.key==='Enter'&&!event.isComposing)sendDayMsg()">
        <button onclick="sendDayMsg()">発言</button>
      </div>`:''}

      <div class="done-btn-wrap">
        <div class="done-count" id="done-count">
          <b>0</b> / ${humanCount} 人が完了
        </div>
        ${G.soloMode||humanCount>0?`<button class="btn btn-ok" id="done-btn" onclick="pressDone()">✅ 話し合い完了</button>`:''}
        <button class="btn btn-ghost btn-sm" style="margin-top:4px" onclick="votePhase()">⏭️ スキップして投票へ</button>
      </div>
    </div>`;
  }

  R(buildScreen());

  // タイマー（表示のみ、自動終了しない）
  const tickTimer=()=>{
    const arc=qs('#tr-arc'),txt=qs('#timer-txt');
    if(!arc||!txt)return;
    const ratio=Math.max(0,(totalSec-elapsed)/totalSec);
    arc.style.strokeDashoffset=r22*(1-ratio);
    if(elapsed>=totalSec){arc.classList.add('low');txt.classList.add('low');}
    txt.textContent=`${Math.floor(elapsed/60)}:${pad(elapsed%60)}`;
    elapsed++;
  };
  tickTimer();
  G.timers.iv=setInterval(tickTimer,1000);

  // ソロモードのBot発言スケジューリング
  if(G.soloMode&&botPool.length) scheduleBotTalk(botPool);

  // 完了ボタン押下（ソロ専用 or 手渡し）
  window.pressDone=()=>{
    if(!mePlayer&&!G.soloMode){
      // 手渡しモード: ホストが代表で押す想定
      G.doneSet.add(-1);
    } else if(mePlayer){
      G.doneSet.add(mePlayer.id);
    }
    updateDoneUI();
    toast('✅ 完了ボタンを押しました');
  };

  window.sendDayMsg=()=>{
    const inp=qs('#day-inp');
    const v=inp?.value.trim(); if(!v)return;
    const m={from:mePlayer?.name||'あなた',isMe:true,bot:false,text:v};
    G.dayLog.push(m);
    const log=qs('#day-log');
    if(log){
      qs('#empty-log')?.remove();
      log.insertAdjacentHTML('beforeend',msgHtml(m));
      log.scrollTop=log.scrollHeight;
    }
    inp.value='';
    // Botが1〜2秒後に反応
    triggerBotReaction(m,botPool);
  };

  updateDoneUI();
}

function scheduleBotTalk(botPool){
  if(!G?.timers)return;
  // Bot発言間隔: 3〜7秒（落ち着いた速度）
  const delay=3000+Math.random()*4000;
  const tid=setTimeout(()=>{
    const logEl=qs('#day-log');
    if(!logEl||!G?.soloMode)return;
    const bot=rand(botPool.filter(b=>b.alive));
    if(!bot){scheduleBotTalk(botPool);return;}
    const line=genBotDayLine(bot,G.night,G.day);
    if(!line){scheduleBotTalk(botPool);return;}
    const m={from:bot.name,bot:true,isMe:false,text:line};
    G.dayLog.push(m);
    qs('#empty-log')?.remove();
    logEl.insertAdjacentHTML('beforeend',`<div class="msg"><small>${e(m.from)}</small>${e(m.text)}</div>`);
    logEl.scrollTop=logEl.scrollHeight;
    scheduleBotTalk(botPool);
  },delay);
  G.timers.bots.push(tid);
}

function triggerBotReaction(playerMsg,botPool){
  if(!botPool?.length)return;
  const bot=rand(botPool.filter(b=>b.alive));
  if(!bot)return;
  const delay=1200+Math.random()*2200;
  const tid=setTimeout(()=>{
    const log=qs('#day-log');
    if(!log)return;
    const reactions=[
      `${e(playerMsg.from)} さんの意見、参考になります。私も同意します。`,
      `${e(playerMsg.from)} さん、それは重要な情報ですね。`,
      `でも ${e(playerMsg.from)} さん、本当にそれで大丈夫ですか？`,
      `${e(playerMsg.from)} さんに同意。今日はそこを追及すべきです。`,
      `${e(playerMsg.from)} さんが積極的なのが少し気になります…`,
    ];
    const m={from:bot.name,bot:true,isMe:false,text:rand(reactions)};
    G.dayLog.push(m);
    log.insertAdjacentHTML('beforeend',`<div class="msg"><small>${e(m.from)}</small>${e(m.text)}</div>`);
    log.scrollTop=log.scrollHeight;
  },delay);
  G.timers.bots.push(tid);
}

/* 延長確認 */
function askExtension(){
  G.extVotes.asked=true;
  clearTimers(); // タイマー一時停止

  const humanAlive=G.players.filter(p=>!p.bot&&p.alive);
  const needed=Math.ceil(humanAlive.length/2);

  // ソロモードは自動で確認
  if(G.soloMode){
    R(`<div class="screen">
      <div class="center" style="min-height:60vh">
        <div style="font-size:3rem">⏱️</div>
        <h2 style="margin:12px 0">話し合いを延長しますか？</h2>
        <p style="color:var(--dim);max-width:260px;margin-bottom:20px">+2分の延長が可能です。</p>
        <button class="btn btn-ok" style="max-width:280px" onclick="extendDay()">✅ 延長する（+2分）</button>
        <button class="btn btn-red" style="max-width:280px;margin-top:8px" onclick="votePhase()">🗳️ そのまま投票へ</button>
      </div>
    </div>`);
    return;
  }

  // 手渡しモード: 各プレイヤーに確認
  G.extVotes={yes:0,no:0,asked:true};
  passDevice(humanAlive,0,'延長確認',(p,next)=>{
    R(`<div class="screen">
      <div class="center" style="min-height:55vh">
        <span class="tag vio">延長確認</span>
        <div style="font-size:1.4rem;font-weight:700;margin:14px 0">${e(p.name)} さん</div>
        <p style="color:var(--dim);margin-bottom:20px">話し合いをもう2分延長しますか？<br><small>（半数以上が同意で延長）</small></p>
        <button class="btn btn-ok" style="max-width:240px" onclick="extVote(true,window._extNext)">✅ 延長する</button>
        <button class="btn btn-ghost" style="max-width:240px;margin-top:8px" onclick="extVote(false,window._extNext)">→ そのまま投票へ</button>
      </div>
    </div>`);
    window._extNext=next;
  },()=>{
    const half=Math.ceil(humanAlive.length/2);
    if(G.extVotes.yes>=half) extendDay();
    else votePhase();
  });
}

window.extVote=(yes,next)=>{
  if(yes) G.extVotes.yes++;else G.extVotes.no++;
  next();
};
function extendDay(){
  toast('⏱️ +2分 延長します！',2000);
  G.doneSet=new Set();
  G.extVotes={yes:0,no:0,asked:false};
  const nightMsg='（延長議論中）';
  dayPhase(nightMsg);
}

/* ============================================================
   強化AI Bot 発言ロジック
   ============================================================ */
function genBotDayLine(bot,night,dayNum){
  const others=alive().filter(p=>p.id!==bot.id);
  if(!others.length)return null;
  const rnd=rand(others);
  const seerBlack=G.seerResults.find(r=>r.result==='wolf'&&G.players[r.id]?.alive);
  const mySeer=G.seerResults.find(r=>r.by===bot.name);
  const suspects=getSuspected(bot);
  const tgt=suspects.length?suspects[0]:rnd;

  // 役職CO
  if(!bot.coRole&&Math.random()<0.1){
    if(bot.role==='seer'&&mySeer){
      bot.coRole='seer';
      return `実は私が本物の占い師です！${mySeer.night}日目夜に ${mySeer.name} さんを占いました。結果は【${mySeer.result==='wolf'?'🐺 人狼':'✓ 白（市民）'}】でした！`;
    }
    if(bot.role==='knight'&&Math.random()<0.35){
      bot.coRole='knight';
      return '騎士として名乗り出ます。毎晩誰かを守っています。信じてください！';
    }
  }

  if(bot.role==='wolf'||bot.role==='spy'){
    return rand([
      `${e(tgt.name)} さん、昨夜から黙りがちですね。怪しくないですか？`,
      `私は絶対に市民です！発言内容を見てもらえれば分かります。`,
      `今日の投票は ${e(tgt.name)} さんに向けるべきだと思います。`,
      `${e(rand(others).name)} さん、占い師ならCOしてください。`,
      `情報出しが少ない人から追放すべきでは。`,
      `私には ${e(tgt.name)} さんの行動が矛盾して見えます。`,
    ]);
  }

  if(dayNum===1){
    return rand([
      `${e(rand(others).name)} さん、昨夜誰かを占いましたか？`,
      `まず自己紹介しましょう。黙っている人が怪しいかも。`,
      `占い師の方はいますか？情報を共有してほしいです。`,
      `静かな ${e(tgt.name)} さんが少し気になります。`,
      `私は市民です。人狼を見つけて村を守りましょう！`,
    ]);
  }

  if(seerBlack&&Math.random()<0.35){
    const acc=G.players[seerBlack.id];
    if(acc?.alive) return `${e(acc.name)} さんが人狼だという情報があります。今日は ${e(acc.name)} さんに投票を集めましょう！`;
  }

  return rand([
    `${e(tgt.name)} さんの発言が矛盾していると思います。説明してください。`,
    `今日の投票は ${e(tgt.name)} さんに絞るべきです。`,
    `昨夜の犠牲者を考えると、${e(tgt.name)} さんが怪しいです。`,
    `もし今日失敗したら人狼に負けます。慎重に行きましょう。`,
    `${e(rand(others).name)} さん、どこに投票しますか？`,
    `人狼は ${night>=2?'残り少ない':'潜伏中の'}はずです。今日こそ仕留めましょう。`,
  ]);
}

function getSuspected(bot){
  const blacks=G.seerResults.filter(r=>r.result==='wolf').map(r=>r.id);
  const s=alive().filter(p=>p.id!==bot.id&&blacks.includes(p.id));
  return s.length?s:alive().filter(p=>p.id!==bot.id);
}

/* ============================================================
   VOTE PHASE
   ============================================================ */
function votePhase(){
  clearTimers();
  G.votes={};
  const humanAlive=G.players.filter(p=>!p.bot&&p.alive);
  if(humanAlive.length===0){botVote();tally();return;}
  passDevice(humanAlive,0,'追放投票',(p,next)=>{
    const targets=alive().filter(x=>x.id!==p.id);
    renderPickTarget(
      `🗳️ ${e(p.name)} さん — 追放する人を選ぶ`,
      targets,'投票する','red',
      id=>{G.votes[p.id]=id;next();}
    );
  },()=>{botVote();tally();});
}

function botVote(){
  alive().filter(p=>p.bot).forEach(b=>{
    const targets=alive().filter(x=>x.id!==b.id);
    if(!targets.length)return;
    if(b.role==='wolf'||b.role==='spy'){
      const ht=targets.filter(x=>!x.bot);
      G.votes[b.id]=(ht.length?rand(ht):rand(targets)).id;
    } else {
      const br=G.seerResults.find(r=>r.result==='wolf'&&G.players[r.id]?.alive);
      G.votes[b.id]=br?br.id:rand(targets).id;
    }
  });
}

function tally(){
  const counts={};
  Object.values(G.votes).forEach(v=>counts[v]=(counts[v]||0)+1);
  const maxV=Math.max(0,...Object.values(counts));
  const top=Object.keys(counts).filter(k=>counts[k]===maxV);
  let resultMsg='同票のため、追放者なし。';
  let exiled=null;
  if(top.length===1){
    exiled=G.players[+top[0]];
    exiled.alive=false;
    resultMsg=`${exiled.name} さんが村から追放されました。`;
  }
  const total=Object.values(G.votes).length;
  const barHtml=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([id,cnt])=>{
    const p=G.players[+id];
    const pct=Math.round(cnt/total*100);
    const col=p.id===exiled?.id?'var(--red)':'var(--vio)';
    return `<div class="vote-row">
      <span class="vote-name">${e(p.name)}</span>
      <div class="vote-bar-wrap"><div class="vote-bar" style="width:${pct}%;background:${col}"></div></div>
      <span class="vote-count">${cnt}票</span>
    </div>`;
  }).join('');
  const w=checkWinner();
  R(`<div class="screen">
    <h2 style="margin-bottom:14px">🗳️ 投票結果</h2>
    <div class="vote-result">${barHtml}</div>
    <div class="card ${exiled?'red':'gold'}" style="margin-top:10px">
      <div style="font-weight:700;font-size:.96rem">${e(resultMsg)}</div>
      ${exiled?`<div style="font-size:.82rem;color:var(--dim);margin-top:3px">役職：${RI[exiled.role]} ${RN[exiled.role]}</div>`:''}
    </div>
    <button class="btn ${w?'btn-gold':'btn-vio'}" style="margin-top:18px" onclick="${w?`showResult('${w}','')` :'nightPhase()'}">
      ${w?'結果を見る →':'夜へ進む →'}
    </button>
  </div>`);
}

/* ============================================================
   WINNER CHECK
   ============================================================ */
function checkWinner(){
  const a=alive();
  const wc=a.filter(p=>p.role==='wolf').length;
  if(wc===0) return 'citizen';
  if(wc>=a.length-wc) return 'wolf';
  return null;
}

/* ============================================================
   RESULT
   ============================================================ */
function showResult(winner,extraMsg=''){
  clearTimers();
  const isWin=winner==='citizen';
  const rows=G.players.map(p=>
    `<tr>
      <td>${e(p.name)}${p.bot?' <span class="tag" style="font-size:.68rem">Bot</span>':''}</td>
      <td>${RI[p.role]} ${RN[p.role]}</td>
      <td>${p.alive?'<span class="tag ok">生存</span>':'<span class="tag red">死亡</span>'}</td>
    </tr>`
  ).join('');
  R(`<div class="screen">
    <div class="center" style="min-height:auto;padding:36px 0 16px">
      <div class="big-emoji" style="font-size:5.5rem">${isWin?'☀️':'🌑'}</div>
      <div class="result-big ${isWin?'win':'lose'}">${isWin?'市民陣営の勝利':'人狼陣営の勝利'}</div>
      <p style="color:var(--dim);margin-top:4px;font-size:.9rem">${e(extraMsg||(isWin?'人狼が全滅しました！':'人狼が村を支配しました…'))}</p>
    </div>
    <div class="card" style="margin-top:4px">
      <h3 style="margin-bottom:10px;color:var(--moon)">全役職公開</h3>
      <table class="ptable"><tbody>${rows}</tbody></table>
    </div>
    ${G.seerResults.length?`
    <div class="card">
      <h3 style="margin-bottom:8px;color:var(--moon)">🔮 占い結果まとめ</h3>
      ${G.seerResults.map(r=>`<div class="row"><span>${e(r.name)}</span><span class="tag ${r.result==='wolf'?'red':'ok'}">${r.result==='wolf'?'🐺 人狼':'✓ 白'}</span></div>`).join('')}
    </div>`:''}
    <button class="btn btn-vio" style="margin-top:6px" onclick="home()">🏠 ホームに戻る</button>
    <button class="btn btn-ghost" style="margin-top:6px" onclick="startGame()">🔄 もう一度（同じ設定）</button>
  </div>`);
}

/* ============================================================
   HELPERS
   ============================================================ */
function alive(all=false){
  return all?G.players:G.players.filter(p=>p.alive);
}
function clearTimers(){
  if(!G?.timers)return;
  clearInterval(G.timers.iv);
  clearTimeout(G.timers.to);
  (G.timers.bots||[]).forEach(clearTimeout);
  G.timers={iv:null,to:null,bots:[]};
}
function scrollEl(id){
  const el=qs('#'+id);
  if(el) el.scrollTop=el.scrollHeight;
}

/* ============================================================
   INIT
   ============================================================ */
home();
</script>
</body>
</html>
